<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <meta name="description" content="天下第一家专用进销存：采购入库、销售出库、库存预警、报表统计，支持手机与外网访问。">
  <title>天下第一家专用进销存</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- 开机欢迎动画 -->
  <div id="splash" class="splash">
    <div class="splash-inner">
      <div class="splash-mark" id="splash-mark">天</div>
      <div class="splash-title" id="splash-title">欢迎使用天下第一家的进销存系统</div>
      <div class="splash-sub" id="splash-sub">天下第一家 · 专用进销存</div>
      <!-- 进度条与倒计时环共用同一块固定高度区域，切换时不会引起整体位移 -->
      <div class="splash-foot">
        <div class="splash-bar"><i></i></div>
        <div class="splash-count" id="splash-count" hidden>
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <circle class="ring-bg" cx="24" cy="24" r="20"></circle>
            <circle class="ring-fg" id="splash-ring" cx="24" cy="24" r="20"></circle>
          </svg>
          <span id="splash-num">6</span>
        </div>
      </div>
    </div>
    <button type="button" class="splash-fs" id="splash-fs" hidden>⛶ 点击任意位置进入全屏</button>
    <button type="button" class="splash-skip" id="splash-skip">跳过 ›</button>
  </div>

  <!-- 登录 -->
  <div id="login" class="login-view">
    <div class="login-card">
      <div class="login-brand">
        <div class="logo-mark" id="login-mark">天</div>
        <div>
          <h1 id="brand-title">天下第一家专用进销存</h1>
          <p>采购 / 销售 / 库存 · 本地部署</p>
        </div>
      </div>
      <form id="login-form" autocomplete="off">
        <label>账号<input type="text" name="username" placeholder="admin" required></label>
        <label>密码<input type="password" name="password" placeholder="默认 admin123" required></label>
        <button type="submit" class="btn-primary">登 录</button>
        <p id="login-error" class="form-error"></p>
      </form>
      <p class="login-tip">默认管理员：admin / admin123，登录后请及时修改密码</p>
    </div>
  </div>

  <!-- 主应用 -->
  <div id="app" class="app-view" hidden>
    <nav id="sidebar">
      <div class="side-brand">
        <span class="logo-mark small" id="side-mark">天</span>
        <span class="side-brand-txt"><b id="side-name">天下第一家</b><em>专用进销存</em></span>
      </div>
      <ul class="nav-list">
        <li data-view="dashboard" class="active">📊 仪表盘</li>
        <li data-view="products">📦 商品管理</li>
        <li data-view="purchase">⬇️ 采购入库</li>
        <li data-view="sale">⬆️ 销售出库</li>
        <li data-view="inventory">🏷️ 库存管理</li>
        <li data-view="finance">💰 收付款</li>
        <li data-view="suppliers">🏭 供应商</li>
        <li data-view="customers">🧑‍💼 客户</li>
        <li data-view="reports">📈 报表</li>
      </ul>
      <div id="side-music" class="side-music" hidden></div>
      <div id="side-sales" class="side-sales" hidden></div>
      <div class="side-foot">
        <span id="user-name">管理员</span>
        <div>
          <button id="fs-btn" class="btn-ghost small" title="进入全屏">⛶</button>
          <button id="pwd-btn" class="btn-ghost small" title="修改密码">🔑</button>
          <button id="logout-btn" class="btn-ghost small">退出</button>
        </div>
      </div>
    </nav>

    <main id="main">
      <header id="topbar">
        <h2 id="view-title">仪表盘</h2>
        <div id="topbar-actions"></div>
        <button id="m-user" class="btn-ghost small" title="账户与退出">👤</button>
      </header>
      <section id="content"></section>
    </main>
    <div id="modal-root"></div>
    <div id="toast" class="toast" hidden></div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
